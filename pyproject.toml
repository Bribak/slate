[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "slate"
version = "0.1.0"
description = "A small Python editor that keeps out of the way of your RAM"
readme = "README.md"
authors = [{name = "Daniel Bojar"}]
requires-python = ">=3.10"
dependencies = ["pywebview>=6.2", "jedi>=0.19", "pycodestyle>=2.11"]

[project.gui-scripts]
slate = "slate.app:main"

[tool.setuptools.packages.find]
include = ["slate*"]

[tool.setuptools.package-data]
slate = ["launcher.cs", "web/*.*", "web/vendor/**/*"]
