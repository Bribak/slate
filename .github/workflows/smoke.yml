# slate in a real window on GitHub's macOS, Windows and Ubuntu machines (tools/smoke.py), and on macOS and Ubuntu also the
# app that `python -m slate --install` makes, opened with a file the way Finder or the desktop opens one. A push to main whose
# __version__ has no release yet becomes release vX.Y.Z once all three pass: that is what slate's update notice offers and
# installs (slate/update.py).
name: smoke

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-latest, ubuntu-24.04]  # macos-14 is retired on 2026-11-02 (actions/runner-images#13518)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        if: runner.os != 'Linux'
        with:
          python-version: '3.12'
      # Linux as the README installs it: the distribution's GTK, WebKitGTK and PyGObject, and a venv on the system's Python
      # that sees them (--system-site-packages), so pip builds nothing. Xvfb is the screen. The sysctl lets WebKit's sandbox
      # (bubblewrap) make user namespaces, in case the runner's AppArmor forbids them
      - name: GTK, WebKitGTK and a venv (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-gi gir1.2-webkit2-4.1 python3-venv xvfb xauth desktop-file-utils libglib2.0-bin
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          python3 -m venv --system-site-packages "$RUNNER_TEMP/venv"
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
      - name: Install slate as the group does, from this checkout
        run: python -m pip install .
      - name: Smoke test in a real window
        run: ${{ runner.os == 'Linux' && 'xvfb-run -a ' || '' }}python tools/smoke.py
      - name: slate.app opens a file (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          python -m slate --install --no-settings
          app="$HOME/Applications/slate.app"
          plutil -p "$app/Contents/Info.plist" | grep -E 'CFBundleIdentifier|public.python-script'
          codesign --verify "$app"
          mkdir -p "$RUNNER_TEMP/project" && echo 'x = 1' > "$RUNNER_TEMP/project/hello.py"
          open -a "$app" "$RUNNER_TEMP/project/hello.py"
          state="$HOME/Library/Application Support/slate/state.json"
          for i in $(seq 1 90); do grep -q hello.py "$state" 2>/dev/null && break; sleep 1; done
          grep -o '"path": "[^"]*hello.py"' "$state"
          pkill -f 'slate' || true
          python -m slate --uninstall
          test ! -e "$app"
      - name: The desktop entry opens a file (Linux)
        if: runner.os == 'Linux'
        run: |
          python -m slate --install --no-settings
          entry="$HOME/.local/share/applications/io.github.bribak.slate.desktop"
          desktop-file-validate "$entry"
          test -f "$HOME/.local/share/icons/hicolor/256x256/apps/io.github.bribak.slate.png"
          mkdir -p "$RUNNER_TEMP/project" && echo 'x = 1' > "$RUNNER_TEMP/project/hello.py"
          state="$HOME/.config/slate/state.json"
          xvfb-run -a bash -c "gio launch '$entry' '$RUNNER_TEMP/project/hello.py'; for i in \$(seq 1 90); do grep -q hello.py '$state' 2>/dev/null && break; sleep 1; done; pkill -f '[-]m slate' || true"
          grep -o '"path": "[^"]*hello.py"' "$state"
          python -m slate --uninstall
          test ! -e "$entry"

  release:
    needs: smoke
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Release __version__ if it is new and newer than the last release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -nE "s/^__version__ = ['\"]([0-9.]+)['\"].*/\1/p" slate/__init__.py)
          last=$(git ls-remote --tags --refs origin 'v*' | sed 's|.*refs/tags/v||' | sort -V | tail -n 1)
          echo "__version__ $version, last release ${last:-none}"
          if [ -z "$version" ] || [ "$version" = "$last" ]; then exit 0; fi
          if ! printf '%s\n' "$last" "$version" | sort -V -C; then
            echo "::warning::__version__ $version is older than release $last, so it is not released"; exit 0
          fi
          gh release create "v$version" --target "$GITHUB_SHA" --title "slate $version" --generate-notes
